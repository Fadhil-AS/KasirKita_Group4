# Profil test: pakai H2 in-memory, tidak butuh MySQL berjalan.
spring.datasource.url=jdbc:h2:mem:kasirkita;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
kasirkita.seed.admin-username=admin
kasirkita.seed.admin-password=admin123
