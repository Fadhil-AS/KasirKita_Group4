# ===== Datasource (MySQL 8.x) =====
# Kredensial via environment variable (NF3). Default hanya untuk dev lokal.
spring.datasource.url=jdbc:mysql://localhost:3306/kasirkita?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Server =====
server.port=8090

# ===== Seed user admin awal (dibuat sekali saat startup jika tabel user kosong) =====
kasirkita.seed.admin-username=admin
kasirkita.seed.admin-password=${ADMIN_PASS:admin123}
